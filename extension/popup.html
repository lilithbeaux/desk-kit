<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; color: #f8f8f2; background: #16161d; }
    h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: 0.5px; }
    .status { padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; border: 1px solid #333; }
    .ok { background: #0f2a1a; border-color: #50fa7b; color: #50fa7b; }
    .bad { background: #2a0f0f; border-color: #ff2f2f; color: #ff2f2f; }
    .tool-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #222; font-size: 12px; }
    .tool-row .name { font-family: ui-monospace, monospace; }
    .tool-row .avail { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .avail.yes { background: #0f2a1a; color: #50fa7b; }
    .avail.no { background: #2a1a0f; color: #ffb86c; }
    button { background: #00efff; color: #0a0a0f; border: none; border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
    button:hover { filter: brightness(1.15); }
    .output { margin-top: 10px; font-size: 11px; font-family: ui-monospace, monospace; background: #0d0d13; padding: 8px; border-radius: 6px; max-height: 140px; overflow: auto; white-space: pre-wrap; }
    .log { margin-top: 8px; font-size: 10px; color: #8e8e8e; max-height: 80px; overflow: auto; }
    a { color: #00efff; font-size: 11px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>⌨ DeskKit Commander</h1>
  <div id="status" class="status bad">checking…</div>
  <div id="tools"></div>
  <button id="probe">Run Active-Window Probe</button>
  <button id="probe2">Get Cursor Position</button>
  <div id="output" class="output">—</div>
  <div class="log" id="log"></div>
  <div style="margin-top:8px"><a href="harvest.html" target="_blank">Open Reasoning Harvest →</a></div>
  <script src="popup.js"></script>
</body>
</html>
